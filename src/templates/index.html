<!DOCTYPE html>
<html lang="pt-br">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Extrator de áudio</title>
    <style>
      body {
        font-family: sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background-color: #f4f4f9;
        margin: 0;
      }

      .container {
        background: white;
        padding: 2rem;
        border-radius: 12px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        text-align: center;
      }

      .file-input {
        display: none;
      }

      .btn-upload {
        background-color: #DDC5EB;
        color: white;
        padding: 12px 24px;
        border-radius: 6px;
        cursor: pointer;
        display: inline-block;
        margin-bottom: 20px;
        transition: 0.3s;
      }

      .btn-upload:hover {
        background-color: #cda3e0;
      }

      .btn-download {
        background-color: #DDC5EB;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
        font-size: 14px;
      }

      .loading {
        color: #888;
        font-size: 0.9rem;
        margin-bottom: 10px;
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h2>Extrator de áudio em vídeo</h2>

      <form id="form" action="/upload" method="post" enctype="multipart/form-data">
        <label for="video-upload" class="btn-upload">
          Escolha o vídeo a ter seu áudio extraído
        </label>

        <input id="video-upload" class="file-input" type="file" name="file" accept="video/*">
      </form>

      <div id="msg" class="loading">Processando vídeo em áudio...</div>

      <a id="download" class="btn-download" style="display:none;">
        ⬇️ Baixar o áudio .wav
      </a>
      
      <script>
        const form = document.getElementById("form");
        const fileInput = document.getElementById("video-upload");
        const msg = document.getElementById("msg");
        const download = document.getElementById("download");

        fileInput.addEventListener("change", async () => {
          if (!fileInput.files.length) return;

          msg.style.display = "block";
          msg.innerText = "Processando...";

          const formData = new FormData(form);

          const res = await fetch("/upload", {
            method: "POST",
            body: formData
          });

          const data = await res.json();

          if (data.erro) {
            msg.innerText = "Erro: " + data.erro;
            return;
          }

          msg.innerText = "Pronto!";

          download.href = data.download_url;
          download.style.display = "inline-block";
        });
      </script>
  </body>

</html>
