<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transcritor de Áudio</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-color: #e8a5b5;
      --text-dark: #4a4a4a;
      --text-light: #888;
      --bg-color: #fdfbfb;
    }

    body {
      font-family: 'Inter', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: var(--bg-color);
      margin: 0;
      color: var(--text-dark);
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 90%;
      padding: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3rem;
      margin-bottom: 10px;
      font-weight: 700;
    }

    h1 span {
      color: var(--primary-color);
    }

    .subtitle {
      font-size: 1.1rem;
      color: var(--text-light);
      margin-bottom: 40px;
      line-height: 1.5;
      font-weight: 400;
    }

    .upload-card {
      background: white;
      padding: 40px;
      border-radius: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
      margin-bottom: 30px;
    }

    .drop-zone {
      border: 2px dashed #e0e0e0;
      border-radius: 20px;
      padding: 50px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }

    .drop-zone:hover {
      border-color: var(--primary-color);
      background-color: #fffafb;
    }

    .upload-icon {
      background-color: var(--primary-color);
      width: 50px;
      height: 50px;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 20px;
      color: white;
      font-size: 24px;
    }

    .drop-zone-text {
      font-weight: 500;
      font-size: 1.1rem;
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    .drop-zone-subtext {
      font-size: 0.9rem;
      color: var(--text-light);
    }

    .file-input {
      display: none;
    }

    .loading {
      margin-top: 20px;
      color: var(--primary-color);
      font-weight: 500;
      display: none;
    }

    .btn-download {
      background-color: var(--primary-color);
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 12px;
      font-weight: 500;
      display: inline-block;
      margin-top: 20px;
      transition: opacity 0.3s;
    }

    .btn-download:hover {
      opacity: 0.9;
    }

    .footer-text {
      font-size: 0.85rem;
      color: var(--text-light);
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Transcreva seu <span>áudio</span></h1>
    <p class="subtitle">Envie um arquivo de áudio ou vídeo e obtenha a transcrição completa em segundos.</p>

    <div class="upload-card">
      <form id="form" action="/upload" method="post" enctype="multipart/form-data">
        <label for="video-upload" class="drop-zone">
          <div class="upload-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="17 8 12 3 7 8"></polyline>
              <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
          </div>
          <div class="drop-zone-text">Arraste seu arquivo aqui</div>
          <div class="drop-zone-subtext">ou clique para selecionar · Áudio ou Vídeo · Máx. 25MB</div>

          <input id="video-upload" class="file-input" type="file" name="file" accept="video/*,audio/*">
        </label>
      </form>

      <div id="msg" class="loading">Processando arquivo...</div>

      <a id="download" class="btn-download" style="display:none;">
        ⬇️ Baixar o arquivo processado
      </a>
    </div>

    <p class="footer-text">Formatos suportados: MP3, WAV, OGG, M4A, MP4, WEBM e mais</p>
  </div>

  <script>
    const form = document.getElementById("form");
    const fileInput = document.getElementById("video-upload");
    const msg = document.getElementById("msg");
    const download = document.getElementById("download");

    fileInput.addEventListener("change", async () => {
      if (!fileInput.files.length) return;

      msg.style.display = "block";
      msg.innerText = "Processando...";
      download.style.display = "none";

      const formData = new FormData(form);

      try {
        const res = await fetch("/upload", {
          method: "POST",
          body: formData
        });

        const data = await res.json();

        if (data.erro) {
          msg.innerText = "Erro: " + data.erro;
          return;
        }

        msg.innerText = "Pronto!";
        download.href = data.download_url;
        download.style.display = "inline-block";
      } catch (e) {
        msg.innerText = "Erro ao conectar com o servidor.";
      }
    });
  </script>
</body>

</html>
